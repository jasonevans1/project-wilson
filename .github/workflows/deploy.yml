name: deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Laravel Cloud CLI
        run: composer global require laravel/cloud-cli --no-interaction

      - name: Authenticate with Laravel Cloud
        run: cloud auth:token --add ${{ secrets.LARAVEL_CLOUD_TOKEN }}

      - name: Deploy to Laravel Cloud
        run: cloud deploy
